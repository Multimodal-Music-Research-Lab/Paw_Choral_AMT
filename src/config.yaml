wandb:
  enable: false
  project: "pawct_transcription"
  name: "${model.arch}-${model.mode}-${feature.audio_feature}-sr${feature.sample_rate}-fps${feature.frames_per_second}"

tensorboard:
  enable: true
  dir: "${exp.workspace}/tensorboard"

choral:
  enable: false
  num_voices: 4
  voice_names: ["S", "A", "T", "B"]
  # Training-target construction. RP and OC preserve trusted S/A/T/B labels by
  # default; use an explicit legacy_* mode only to reproduce the old relabeling.
  target_assignment: null   # null→part_name; or range_prior | ordered_continuity | range_masked_continuity
  voice_assignment_method: null     # deprecated CLI/checkpoint compatibility alias
  preserve_known_part_labels: true
  evaluation_reference_assignment: "part_name"  # immutable paper/evaluation reference
  oc_gap_decay_seconds: 2.0
  oc_overlap_tolerance_seconds: 0.05
  assignment_module: "heads"   # model-side assignment: heads | va2_cnn | va2_convlstm
  voice_interaction_module: "none"   # none | self_attn
  voice_interaction_dim: 256
  voice_interaction_heads: 4
  voice_interaction_layers: 1
  voice_interaction_dropout: 0.1
  append_assignment_to_name: true
  # Broad compatibility defaults. Formal YouChorale P2/P3 commands override
  # these with the frozen train-only p01/p99 values documented in README.md.
  voice_assignment_range_mins: [60, 55, 48, 40]
  voice_assignment_range_maxs: [88, 79, 72, 67]
  voice_assignment_range_margin: 2.0
  voice_assignment_mask_penalty: 8.0
  assignment_temperature: 1.0
  assignment_hidden_channels: 64
  assignment_rnn_hidden_size: 128
  voice_assignment_part_penalty: 2.0
  voice_assignment_continuity_weight: 0.35
  voice_assignment_overlap_penalty: 4.0
  use_presence_head: true
  apply_presence_gate: false  # keep presence as an auxiliary task; do not cap note probabilities
  use_per_voice_thresholds: false
  voice_frame_thresholds: [0.3, 0.3, 0.3, 0.3]
  voice_onset_thresholds: [0.3, 0.3, 0.3, 0.3]
  voice_offset_thresholds: [0.3, 0.3, 0.3, 0.3]
  voice_frame_loss_weight: 1.0
  voice_onset_loss_weight: 1.0
  voice_offset_loss_weight: 1.0
  voice_frame_positive_weight: 1.0
  voice_onset_positive_weight: 1.0
  voice_offset_positive_weight: 1.0
  # RP suppresses unsupported out-of-range mass without penalizing annotated
  # positives. OC compares consecutive annotated onset events (including
  # transitions across rests), with gap decay; it matches target-relative
  # motion instead of flattening correct melodic leaps. Tune on validation only.
  range_prior_loss_weight: 0.0
  continuity_prior_loss_weight: 0.0
  union_frame_loss_weight: 0.5
  union_onset_loss_weight: 0.5
  # max(voice offsets) marks any part release, not the release of the audible
  # union when same-pitch parts overlap. Keep this off until a dedicated union
  # offset head or overlap-aware mask is implemented.
  union_offset_loss_weight: 0.0
  presence_loss_weight: 0.2
  assignment_range_loss_weight: 0.05
  assignment_entropy_loss_weight: 0.01

exp:
  workspace: "./workspaces"
  name_suffix: ""
  resume_iteration: 0
  total_iteration: 200_000
  save_iteration: 5_000
  eval_iteration: 5_000
  learning_rate: 1e-4
  optim: "adam"
  decay: true
  reduce_iteration: 10_000
  loss_type: "auto"
  random_seed: 86
  deterministic_cudnn: true
  mini_data: false
  cuda: true
  debug: false
  num_workers: 8
  batch_size: 8
  max_train_eval_batches: 20  # lightweight monitoring only; never a selection set
  max_eval_batches: null  # complete validation for checkpoint selection; set explicitly only for pilots
  selection_dataset: "${dataset.test_set}"
  selection_metric: "auto"  # mean_voice_frame_ap for PawCT, frame_ap for PagCT
  selection_mode: "max"
  early_stopping_patience_evals: null
  # Parameter-free behavior changes cannot be detected from state-dict keys.
  # Keep false; set true only for an explicitly reported weight-reuse ablation.
  allow_checkpoint_behavior_mismatch: false
  # Checkpoints predating schema v2 do not prove their model/input-coordinate
  # or frontend identity. This opt-in is deliberately independent of the
  # behavior-mismatch switch and must remain false for formal experiments.
  allow_legacy_checkpoint_model_identity: false
  # Exact continuation restores all RNG and logical sampler state. This escape
  # hatch is only for clearly labelled historical checkpoints that lack it.
  allow_inexact_resume: false
  # PyTorch's restricted weights-only loader is always tried first. Enabling
  # this permits arbitrary-code-capable pickle loading only for trusted,
  # pre-schema-v2 checkpoints and is independent of all mismatch flags.
  allow_unsafe_legacy_checkpoint_load: false
  # Pre-fix checkpoints do not prove whether choral global targets came from
  # merged MIDI or the canonical note.pkl projector. Formal runs keep this off.
  allow_legacy_canonical_union_semantics: false
  # Historical/unversioned PawCT files do not prove which RP/OC targets trained
  # them. Keep both switches false for formal resume, inference, and scoring.
  allow_unknown_checkpoint_target_assignment: false
  allow_checkpoint_target_assignment_mismatch: false
  # Formal scoring requires a complete split and matching checkpoint provenance
  # in every probability file. Set false only to inspect pre-release artifacts.
  require_probability_provenance: true
  run_infer: "single"
  ckpt_iteration: ""

feature:
  audio_feature: "logmel"
  classes_num: 88
  segment_seconds: 10.0
  hop_seconds: 1.0
  sample_rate: 16000
  fft_size: 2048
  frames_per_second: 100
  use_augmentation: false
  augmentor: null
  begin_note: 21
  velocity_scale: 128
  max_note_shift: 0

dataset:
  train_set: "maestro"
  test_set: "smd"
  # Override these repository-relative paths from the CLI when needed, e.g.
  # dataset.youchorale_dir=/absolute/path/to/YouChorale.
  eval_split: "validation"  # validation | test
  cantoria_dir: "./data/CantoriaDataset_v1.0.0"
  cantoria_f0_source: "crepe"   # crepe | pyin
  cantoria_min_confidence: 0.35
  cantoria_min_note_duration: 0.08
  smd_dir: "./datasets/SMD"
  csd_dir: "./data/ChoralSingingDataset"
  youchorale_dir: "./data/YouChorale"
  # Optional train/valid/test JSON directory. When set, its three disjoint
  # manifests must cover the packed YouChorale stems exactly and override the
  # historical split attributes stored inside those HDF5 files.
  youchorale_split_dir: null
  youchorale_pro_dir: "./data/YouChorale-Pro"
  maestro_dir: "./datasets/maestro-v3.0.0"
  maps_dir: "./datasets/MAPS"

model:
  arch: "pagct"
  mode: "frame_onset" # "frame_onset_offset"
  type: null
  name: "auto"

post:
  post_processor_type: "onsets_frames" # regression
  frame_threshold: 0.3
  onset_threshold: 0.3
  offset_threshold: 0.3
  pedal_offset_threshold: 0.2
  default_velocity: 80

score:
  evaluate_frame: true
  evaluate_note: true
  evaluate_pedal: false
  onset_tolerance: 0.05
  offset_ratio: 0.2
  offset_min_tolerance: 0.05
  pedal_offset_ratio: 0.2
  pedal_offset_min_tolerance: 0.05
